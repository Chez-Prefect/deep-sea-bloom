<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chez Prefect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020b18;
      color: #e8f4f8;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .aurora {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 20% 40%, rgba(0,255,180,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(80,0,255,0.10) 0%, transparent 55%),
                  radial-gradient(ellipse at 60% 80%, rgba(0,180,255,0.08) 0%, transparent 50%);
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes drift {
      from { transform: scale(1) translateY(0); opacity: 0.8; }
      to   { transform: scale(1.05) translateY(-20px); opacity: 1; }
    }
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 80%, rgba(255,255,255,0.3) 0%, transparent 100%);
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }
    .ufo {
      font-size: 5rem;
      display: block;
      animation: hover 4s ease-in-out infinite;
      margin-bottom: 1rem;
    }
    @keyframes hover {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-18px); }
    }
    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e0f7ff;
      text-shadow: 0 0 40px rgba(0,220,255,0.4);
      margin-bottom: 0.5rem;
    }
    .tagline {
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(180,230,255,0.6);
      margin-bottom: 3rem;
    }
    .shop-link {
      display: inline-block;
      padding: 1rem 2.5rem;
      border: 1px solid rgba(0,220,255,0.5);
      color: #e0f7ff;
      text-decoration: none;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      background: rgba(0,180,255,0.06);
    }
    .shop-link:hover {
      background: rgba(0,220,255,0.15);
      border-color: rgba(0,220,255,0.9);
      box-shadow: 0 0 30px rgba(0,220,255,0.2);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="aurora"></div>
  <div class="stars"></div>
  <main>
    <span class="ufo">🛸</span>
    <h1>Chez Prefect</h1>
    <p class="tagline">Objects from the deep &amp; beyond</p>
    <a href="/shop.html" class="shop-link">Enter the Shop</a>
  </main>
</body>
</html>
